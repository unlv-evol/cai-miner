name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-groups
      # The tests build throwaway repositories and commit to them.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: uv run pytest --cov --cov-report=term

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # Install the wheel alone, outside the source tree, and check it finds
      # its bundled catalogue.
      - name: Smoke-test the wheel
        run: |
          cd "$RUNNER_TEMP"
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/cai_miner-*.whl)"
          uvx --from "$wheel" cai-miner --version
          git init -q smoke && cd smoke
          mkdir -p .github/workflows
          printf 'on: pull_request\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: anthropics/claude-code-action@v1\n' \
            > .github/workflows/review.yml
          git add . && git -c user.name=CI -c user.email=ci@example.com commit -qm init
          uvx --from "$wheel" cai-miner --repository smoke/test -q . | tee steps.csv
          grep -q '^smoke/test,.*,claude,step,uses,' steps.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
